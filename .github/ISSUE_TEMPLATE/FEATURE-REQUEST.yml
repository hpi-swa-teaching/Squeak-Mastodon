name: "Feature Request"
description: Create a new ticket for a feature request
title: "[G<gruppe>] FEAT: <title>"
labels: []
body:
  - type: dropdown
    id: group
    attributes:
      label: "Gruppe"
      description: Welche Gruppe?
      options:
        - G09
        - G10
        - G11
    validations:
      required: true
  - type: textarea
    id: usecase
    attributes:
      label: "Was möchte ich tun?"
      description: Was möchte ich tun?
      placeholder: "Als User möchte ich ..."
    validations:
      required: false
  - type: textarea
    id: done
    attributes:
      label: "Definition of done"
      description: Definition of done
      placeholder: "- [ ] All tests passing\n- [ ] New tests added\n"
    validations:
      required: false
